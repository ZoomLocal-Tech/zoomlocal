<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1476e6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Page not found | ZoomLocal</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #030712;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card { text-align: center; max-width: 560px; }
      .code {
        font-size: 88px;
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, #1476e6, #38bdf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 16px;
      }
      h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
      p { color: #9ca3af; font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
      .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }
      a:hover { opacity: 0.85; }
      .primary { background: #1476e6; color: #fff; }
      .secondary { background: rgba(255, 255, 255, 0.08); color: #e5e7eb; border: 1px solid rgba(255, 255, 255, 0.14); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>This page could not be found</h1>
      <p>The link may be outdated or the page may have moved. Head back to the homepage, or explore our free Local SEO tools.</p>
      <div class="links">
        <a class="primary" href="/">Go to homepage</a>
        <a class="secondary" href="/tools">Free tools</a>
        <a class="secondary" href="/blog">Blog</a>
      </div>
    </main>
  </body>
</html>
