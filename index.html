<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/favicon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1476e6">
    <link rel="dns-prefetch" href="https://www.fly-social.com">
    <!-- Google Analytics 4 (zoomlocal.in property) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NRK9X6HGSD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NRK9X6HGSD');
    </script>
    <title>ZoomLocal | Managed Local SEO & Free Audit Tools</title>
    <meta name="description" content="Managed Local SEO services and free white-label audit tools for local businesses and marketing agencies. We manage your Google Business Profile end to end." />
  </head>
  <body>
    <div id="app"></div>
    <!-- Fly first-party page counter. Reports the page address and whether
         this is the visitor's first view today, so zoomlocal.in shows up in
         the Website CMS Traffic tab alongside every site we manage. No
         cookies and nothing personal; the counter follows the address because
         this site changes pages without reloading. -->
    <script>
      (function () {
        try {
          var ENDPOINT = 'https://mvnifwlysiomcztpefar.supabase.co/functions/v1/website-analytics-track';
          var last = null;
          function send() {
            try {
              var path = location.pathname || '/';
              if (path === last) return;
              last = path;
              var k = 'flyv_' + new Date().toISOString().slice(0, 10);
              var n = false;
              try { n = !localStorage.getItem(k); if (n) localStorage.setItem(k, '1'); } catch (e) {}
              var body = JSON.stringify({ site: 'zoomlocal', path: path, nv: n });
              if (navigator.sendBeacon) navigator.sendBeacon(ENDPOINT, body);
              else fetch(ENDPOINT, { method: 'POST', body: body, keepalive: true }).catch(function () {});
            } catch (e) {}
          }
          ['pushState', 'replaceState'].forEach(function (m) {
            var orig = history[m];
            history[m] = function () { var r = orig.apply(this, arguments); setTimeout(send, 0); return r; };
          });
          addEventListener('popstate', send);
          send();
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
